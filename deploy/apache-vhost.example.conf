# Apache VirtualHost example for ops-dashboard (Next.js + pm2)
#
# <SERVER_NAME> … 本番公開ドメイン（admin.gucchii.com）
# <APP_PORT>     … pm2 待受ポート（1Password port、既定 3110）

<VirtualHost *:80>
    ServerName <SERVER_NAME>

    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Proto "http"

    ProxyPass / http://127.0.0.1:<APP_PORT>/
    ProxyPassReverse / http://127.0.0.1:<APP_PORT>/
</VirtualHost>

<VirtualHost *:443>
    ServerName <SERVER_NAME>

    # certbot -d <SERVER_NAME> で証明書取得と同時に以下3行が自動的に有効化される想定。
    # 証明書発行前は SSLEngine も含めてコメントアウトしたままにすること。
    # SSLEngineだけ有効にして証明書行を後回しにすると、mod_sslの初期化失敗で
    # Apacheプロセス全体が起動不能になる（2026-07-27、db.gucchii.comで発生した全断インシデント）。
    # SSLEngine on
    # SSLCertificateFile /etc/letsencrypt/live/<SERVER_NAME>/fullchain.pem
    # SSLCertificateKeyFile /etc/letsencrypt/live/<SERVER_NAME>/privkey.pem

    ProxyPreserveHost On
    RequestHeader set X-Forwarded-Proto "https"

    ProxyPass / http://127.0.0.1:<APP_PORT>/
    ProxyPassReverse / http://127.0.0.1:<APP_PORT>/
</VirtualHost>
