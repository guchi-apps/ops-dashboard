<?xml version="1.0" encoding="UTF-8"?>
<!--
  ops-dashboard のアプリアイコン（デザインの正）。#342
  9タイルの監視盤。右上の緑のタイルが「いま正常に稼働している」ことを表す。
  添付された新デザインをそのまま使用する。PNGの書き出しは scripts/generate-icons.sh。
-->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" role="img" aria-labelledby="title desc">
  <title id="title">ops-dashboard app icon</title>
  <desc id="desc">A nine-tile operations grid with a larger central control tile and one green live-status tile.</desc>
  <rect width="1024" height="1024" fill="#071B38"/>
  <g fill="#398BF5">
    <rect x="192" y="192" width="176" height="176" rx="36"/>
    <rect x="424" y="192" width="176" height="176" rx="36"/>
    <rect x="192" y="424" width="176" height="176" rx="36"/>
    <rect x="656" y="424" width="176" height="176" rx="36"/>
    <rect x="192" y="656" width="176" height="176" rx="36"/>
    <rect x="424" y="656" width="176" height="176" rx="36"/>
    <rect x="656" y="656" width="176" height="176" rx="36"/>
  </g>
  <rect x="408" y="408" width="208" height="208" rx="42" fill="#4EA5FF"/>
  <rect x="656" y="192" width="176" height="176" rx="36" fill="#29D890"/>
</svg>
